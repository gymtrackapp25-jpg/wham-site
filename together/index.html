<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="apple-itunes-app" content="app-id=6793319978">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do a programme with me on WHAM</title>
<meta name="description" content="A friend invited you to do a training programme together on WHAM, the gym tracker.">
<meta property="og:title" content="Start a programme with me on WHAM 💪">
<meta property="og:description" content="Train the same weeks and see each other's progress.">
<meta property="og:image" content="https://getwham.app/covers/v1/build8_m.webp">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #14110D;
    --bg-elevated: #1C1712;
    --text: #EDE7DA;
    --text-muted: #A79C8A;
    --accent: #D1A54B;
    --accent-soft: rgba(209, 165, 75, 0.14);
    --rule: #332A1E;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 16px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    -webkit-font-smoothing: antialiased;
  }
  .card { width: 100%; max-width: 440px; }
  .eyebrow {
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin: 0 0 0.9rem;
  }
  h1 {
    font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 500;
    font-size: clamp(1.7rem, 7.5vw, 2.4rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    margin: 0 0 0.6rem;
    overflow-wrap: anywhere;
  }
  h1 .dim { color: var(--text-muted); opacity: 0.6; }
  .status {
    color: var(--text-muted);
    min-height: 1.6em;
    line-height: 1.6;
    margin: 0 0 1.8rem;
  }
  .status.warn { color: var(--accent); }
  .actions { display: flex; flex-direction: column; gap: 12px; margin: 0 0 1.8rem; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    padding: 14px 20px;
    border-radius: 14px;
    border: 1px solid var(--rule);
    background: var(--bg-elevated);
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 600;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.985); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #14110D;
    font-size: 1.15rem;
  }
  .hint { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin: 0 0 0.6rem; }
  .code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-indent: 0.22em; /* balance the trailing letter-spacing so it centres */
    padding: 14px 8px;
    border: 1px dashed var(--rule);
    border-radius: 14px;
    background: var(--accent-soft);
    color: var(--accent);
    user-select: all;
    -webkit-user-select: all;
    margin: 0 0 1.8rem;
  }
  .lead { color: var(--text-muted); line-height: 1.6; margin: 0 0 1.8rem; font-size: 1.05rem; }
  footer { padding-top: 1.2rem; border-top: 1px solid var(--rule); }
  footer a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
  footer a:hover { text-decoration: underline; }
  [hidden] { display: none !important; }
  .plan { text-align: left; margin: 0 0 1.8rem; border-top: 1px solid var(--rule); }
  .plan li { list-style: none; display: flex; justify-content: space-between; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--rule); }
  .plan ul { margin: 0; padding: 0; }
  .plan .n { font-weight: 600; }
  .plan .s { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .by { color: var(--text-muted); margin: 0 0 1.4rem; }

  .cover { width: 100%; aspect-ratio: 3 / 4; max-height: 52vh; object-fit: cover; object-position: top; border-radius: 18px; margin: 0 0 1.4rem; background: var(--bg-elevated); display: block; }
  .facts { display: flex; gap: 8px; justify-content: center; margin: 0 0 1.6rem; }
  .fact { flex: 1; background: var(--bg-elevated); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 6px; }
  .fact b { display: block; font-size: 1.3rem; color: var(--text); }
  .fact span { color: var(--text-muted); font-size: 0.8rem; }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">WHAM programme invite</p>
    <div id="valid" hidden>
      <img id="cover" class="cover" alt="">
      <h1 id="title">Do it with me</h1>
      <p class="lead" id="lead"></p>
      <div class="facts">
        <div class="fact"><b id="weeks"></b><span>weeks</span></div>
        <div class="fact"><b id="days"></b><span>days a week</span></div>
        <div class="fact"><b id="mins"></b><span>minutes</span></div>
      </div>
      <div class="actions">
        <a id="open" class="btn primary" href="#">Start it together in WHAM</a>
        <a id="store" class="btn" href="#">Get WHAM on the App Store</a>
      </div>
      <p class="hint">New to WHAM? Get the app, then tap this link again to start together.</p>
    </div>
    <div id="invalid" hidden>
      <h1>WHAM</h1>
      <p class="lead">That invite link is incomplete. Ask your friend to send it again.</p>
      <div class="actions">
        <a id="store2" class="btn" href="#">Get WHAM on the App Store</a>
      </div>
    </div>
    <footer><a href="/">getwham.app</a></footer>
  </main>
<script>
  var APP_STORE_URL = "https://apps.apple.com/gb/app/wham-gym/id6793319978";
  // the app's programmes (data/programmes.ts): name, promise, weeks, days, minutes
  var PROGRAMMES = {
    "first24": ["First 24", "24 sessions that make the gym a habit", "6–8", "3–4", 40],
    "build8": ["Build 8", "Put on muscle in 8 weeks, 4 days a week", "8", "4", 55],
    "build8-glutes": ["Build 8 · Glutes", "Bigger, stronger glutes in 8 weeks, 4 days a week", "8", "4", 55],
    "build8-arms": ["Build 8 · Arms", "Arms and shoulders first, 8 weeks, 4 days a week", "8", "4", 55],
    "busy30": ["Busy 30", "Fit and lean in 30 minutes, 3 times a week", "6", "3", 30]
  };
  function normaliseHandle(raw) {
    var s = String(raw == null ? "" : raw).trim().replace(/^@/, "").toLowerCase();
    return /^[a-z0-9_.]{2,30}$/.test(s) ? s : "";
  }
  (function () {
    var q = new URLSearchParams(location.search);
    var code = String(q.get("c") || "").trim().toUpperCase();
    var prog = PROGRAMMES[String(q.get("p") || "")];
    var handle = normaliseHandle(q.get("u"));
    document.getElementById("store").href = APP_STORE_URL;
    document.getElementById("store2").href = APP_STORE_URL;
    if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code) || !prog) { document.getElementById("invalid").hidden = false; return; }
    var who = handle ? "@" + handle : "A friend";
    document.getElementById("cover").src = "/covers/v1/" + q.get("p") + "_m.webp";
    document.getElementById("cover").alt = prog[0];
    document.getElementById("title").textContent = prog[0] + " together";
    document.getElementById("lead").textContent = who + " invited you to do " + prog[0] + " with them. " + prog[1] + ". You'll see each other's progress every week.";
    document.getElementById("weeks").textContent = prog[2];
    document.getElementById("days").textContent = prog[3];
    document.getElementById("mins").textContent = prog[4];
    document.getElementById("open").href = "wham://together/" + encodeURIComponent(code);
    document.getElementById("valid").hidden = false;
  })();
</script>
</body>
</html>
